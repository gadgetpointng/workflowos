name: Verify development

on:
  push:
    branches:
      - 'development/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node scripts/check-commerce-bridge-contract.mjs
      - run: node scripts/check-commerce-idempotency-compatibility.mjs
      - run: node scripts/check-commerce-observability-contract.mjs
      - run: node scripts/check-channel-credential-contract.mjs
      - run: node scripts/check-buyer-dedupe-contract.mjs
      - run: npx tsc --noEmit
      - run: npm run check:release
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://hasnhivdrpeqytgdnkzo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://workflow.gadgetpoint.ng

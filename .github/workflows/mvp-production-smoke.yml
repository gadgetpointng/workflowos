name: WorkflowOS MVP production smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/login/**'
      - 'app/signup/**'
      - 'app/request/**'
      - '.github/workflows/mvp-production-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: workflowos-mvp-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify identity and public-route source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const OWNER_EMAIL = 'gadgetpoint.ng@gmail.com'" app/login/page.tsx
          grep -q 'Staff: Sign in with GadgetPoint' app/login/page.tsx
          grep -q 'Owner: GadgetPoint sign-in' app/login/page.tsx
          grep -q 'Owner: Continue with ChatGPT' app/login/page.tsx
          grep -q 'https://gadgetpoint.ng/api/workflowos/owner-login' app/login/page.tsx
          if grep -Eqi 'signInWithPassword|sendOtp|magic link' app/login/page.tsx || grep -Fqi 'type="password"' app/login/page.tsx || grep -Fqi "type='password'" app/login/page.tsx; then
            echo 'A local WorkflowOS credential fallback exists in the login source.' >&2
            exit 1
          fi
          grep -Rqi 'WorkflowOS accounts are managed by GadgetPoint' app/signup
          grep -Rqi 'GadgetPoint remains the store' app/request
          echo 'Pull-request MVP identity contract is healthy.'

  smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify canonical production contract
        shell: bash
        env:
          BASE_URL: https://workflowos-nine.vercel.app
        run: |
          set -euo pipefail

          fetch_until() {
            path="$1"
            output="$2"
            expected="$3"
            for attempt in $(seq 1 18); do
              code="$(curl --silent --show-error --max-time 20 --output "$output" --write-out '%{http_code}' "${BASE_URL}${path}" || true)"
              echo "${path} attempt ${attempt}/18 -> HTTP ${code:-curl-error}"
              if [ "$code" = "$expected" ]; then
                return 0
              fi
              sleep 10
            done
            echo "${path} never reached HTTP ${expected}" >&2
            cat "$output" || true
            return 1
          }

          fetch_until '/api/health' /tmp/health.json 200
          grep -q '"ok":true' /tmp/health.json
          grep -q '"database":true' /tmp/health.json

          fetch_until '/login' /tmp/login.html 200
          for attempt in $(seq 1 18); do
            if grep -q 'Owner: Continue with ChatGPT' /tmp/login.html; then break; fi
            echo "Waiting for newest login release (${attempt}/18)"
            sleep 10
            curl --silent --show-error --max-time 20 --output /tmp/login.html "${BASE_URL}/login" || true
          done
          grep -q 'Staff: Sign in with GadgetPoint' /tmp/login.html
          grep -q 'Owner: GadgetPoint sign-in' /tmp/login.html
          grep -q 'Owner: Continue with ChatGPT' /tmp/login.html
          grep -q 'gadgetpoint.ng@gmail.com' /tmp/login.html
          grep -q 'WorkflowOS has no public account creation' /tmp/login.html
          if grep -Eqi 'signInWithPassword|sendOtp|magic link' /tmp/login.html || grep -Fqi 'type="password"' /tmp/login.html || grep -Fqi "type='password'" /tmp/login.html; then
            echo 'Local WorkflowOS credential fallback appeared on the production login.' >&2
            exit 1
          fi

          fetch_until '/request' /tmp/request.html 200
          grep -q 'Tell us the gadget you want' /tmp/request.html
          grep -q 'GadgetPoint remains the store' /tmp/request.html

          fetch_until '/signup' /tmp/signup.html 200
          grep -q 'WorkflowOS%20accounts%20are%20managed%20by%20GadgetPoint' /tmp/signup.html
          grep -q 'url=/login' /tmp/signup.html
          if grep -Eqi '<form([[:space:]>])|create account|sign up with email' /tmp/signup.html; then
            echo 'Public account creation appeared on /signup.' >&2
            exit 1
          fi

          curl --silent --show-error --max-time 20 -D /tmp/dashboard.headers -o /tmp/dashboard.body "${BASE_URL}/dashboard" || true
          status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/dashboard.headers)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); print $2}' /tmp/dashboard.headers | tail -n1)"
          echo "/dashboard -> HTTP ${status:-unknown} location=${location:-none}"
          case "$status" in
            301|302|303|307|308)
              echo "$location" | grep -q '^/login'
              ;;
            *)
              if ! grep -q '/login' /tmp/dashboard.body; then
                echo 'Signed-out dashboard did not redirect or resolve to login.' >&2
                exit 1
              fi
              ;;
          esac

          fetch_until '/manifest.webmanifest' /tmp/manifest.json 200
          grep -q 'WorkflowOS' /tmp/manifest.json

          echo 'WorkflowOS canonical MVP production contract is healthy.'

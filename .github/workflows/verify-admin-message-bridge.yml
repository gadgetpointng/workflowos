name: Verify Admin message bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/admin-chat/**'
      - 'components/StaffAdminChat.tsx'
      - 'components/FloatingMessenger.tsx'
      - '.github/workflows/verify-admin-message-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-admin-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require live Admin bridge to fail closed
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --location --max-time 20 --output "$body" --write-out '%{http_code}' 'https://gadgetpoint.ng/api/workflowos/messages')"
          cat "$body"
          test "$status" = "401"
          grep -qi 'unauthorized' "$body"

name: Verify original WorkflowOS login architecture

on:
  push:
    branches:
      - auth-first-plan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Architecture boundaries
        run: npm run check:boundaries
      - name: Verify identity boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "signInWithPassword" app/login app/auth/owner-email
          ! grep -R "signInWithOtp" app/login app/auth/owner-email
          grep -q "gadgetpoint.ng@gmail.com" app/login/page.tsx
          grep -q "staff.workflowos.invalid" app/api/auth/gadgetpoint/sso/route.ts
          grep -q "owner identity must use the owner sign-in route" app/api/auth/gadgetpoint/sso/route.ts
          grep -q "owner identity must use the owner sign-in route" app/auth/gadgetpoint/route.ts

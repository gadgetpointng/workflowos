name: Vercel prebuilt production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-prebuilt-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_yvEBW50bckuFO88igC4cKlSH
  VERCEL_PROJECT_ID: prj_aRYq0lxyu8Hm5CFneOd2HO6R3vjN
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build on GitHub runner
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

name: Vercel prebuilt production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-prebuilt-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_yvEBW50bckuFO88igC4cKlSH
  VERCEL_PROJECT_ID: prj_aRYq0lxyu8Hm5CFneOd2HO6R3vjN
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  CANONICAL_URL: https://workflowos-nine.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repository secret is missing"
            exit 1
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build on GitHub runner
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        id: deploy
        shell: bash
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $DEPLOY_URL"

      - name: Verify production health
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 20 "$CANONICAL_URL/api/health" -o /tmp/health.json; then
              if node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); if (d.ok !== true) process.exit(1)"; then
                cat /tmp/health.json
                exit 0
              fi
            fi
            echo "Health check attempt $attempt failed; retrying..."
            sleep 10
          done
          echo "::error::Canonical production health check did not become healthy"
          exit 1

      - name: Verify protected-route redirect
        shell: bash
        run: |
          curl --silent --show-error --max-time 20 -D /tmp/headers -o /dev/null "$CANONICAL_URL/notifications"
          STATUS="$(awk 'NR==1 {print $2}' /tmp/headers | tr -d '\r')"
          LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[Ll]ocation:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/headers)"
          echo "Status: $STATUS"
          echo "Location: $LOCATION"
          case "$STATUS" in
            301|302|303|307|308) ;;
            *) echo "::error::Protected route did not redirect"; exit 1 ;;
          esac
          case "$LOCATION" in
            *"/login"*) ;;
            *) echo "::error::Protected route did not redirect to /login"; exit 1 ;;
          esac

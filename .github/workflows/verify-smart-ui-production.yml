name: Verify smart UI production

on:
  push:
    branches:
      - smart-ui-production
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Commerce idempotency compatibility gate
        run: node scripts/check-commerce-idempotency-compatibility.mjs
      - name: Commerce observability gate
        run: node scripts/check-commerce-observability-contract.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Boundary checks
        run: npm run check:boundaries
      - name: Notification preference gates
        run: npm run check:notifications

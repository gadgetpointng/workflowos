<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <title>WorkflowOS offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111f;color:#fff;font-family:Arial,sans-serif;padding:24px}.card{width:min(440px,100%);text-align:center;padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:#102033}.icon{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 20px;border-radius:18px;background:#102a43;border:1px solid rgba(255,255,255,.12);font-weight:800;font-size:20px}h1{margin:0 0 10px;font-size:26px}p{margin:0;color:#a9b7c9;line-height:1.6;font-size:14px}button{margin-top:22px;border:0;border-radius:7px;background:#2377ff;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">WO</div>
    <h1>WorkflowOS is offline</h1>
    <p>Your device cannot reach WorkflowOS right now. Reconnect to the internet and try again. Existing protected business data is not stored in this offline page.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
